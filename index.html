    <div id="loading">
        <h1>Pipeline Engineering Calculator</h1>
        <div class="spinner"></div>
        <p>Loading application... (first load may take 30-60 seconds)</p>
        <p style="font-size: 0.9rem; margin-top: 20px;">DNV, ASME & API Standards</p>

        stlite.mount({
            requirements: ["numpy", "plotly"],

            files: {
"app.py": `
import streamlit as st
import numpy as np
import plotly.graph_objects as go
from plotly.subplots import make_subplots
import math

# Page config
st.set_page_config(page_title="Pipeline Engineering Calculator", page_icon="🔧", layout="wide")

# Custom CSS
st.markdown("""
<style>
    .main-header {
        font-size: 2rem;
        font-weight: bold;
        color: #1E3A5F;
        text-align: center;
        padding: 1rem;
        background: linear-gradient(90deg, #E8F4F8 0%, #D1E9F0 100%);
        border-radius: 10px;
        margin-bottom: 1rem;
    }
    .result-pass { background: #d4edda; color: #155724; padding: 0.5rem; border-radius: 5px; }
    .result-fail { background: #f8d7da; color: #721c24; padding: 0.5rem; border-radius: 5px; }
</style>
""", unsafe_allow_html=True)

st.markdown('<div class="main-header">Pipeline Engineering Calculator</div>', unsafe_allow_html=True)
st.markdown("**Educational Tool** | DNV, ASME & API Standards | Formula Explanations")

# Material grades
GRADES = {'Gr.B': (245, 415), 'X42': (290, 415), 'X46': (320, 435), 'X52': (360, 460),
          'X56': (390, 490), 'X60': (415, 520), 'X65': (450, 535), 'X70': (485, 570)}

NPS_OD = {4: 114.3, 6: 168.3, 8: 219.1, 10: 273.1, 12: 323.9, 14: 355.6, 16: 406.4,
          18: 457.2, 20: 508.0, 24: 609.6, 30: 762.0, 36: 914.4}

# Sidebar navigation
calc_type = st.sidebar.radio("Select Calculator", [
    "Wall Thickness (ASME/API)",
    "Free Span (DNV-RP-F105)",
    "CP Anode (DNV-RP-F103)",
    "Corrosion Assessment (DNV-RP-F101)",
    "On-Bottom Stability (DNV-RP-F109)",
    "End Expansion (DNV-ST-F101)"
])

# ============ WALL THICKNESS CALCULATOR ============
if calc_type == "Wall Thickness (ASME/API)":
    st.header("Wall Thickness Calculator")
    st.markdown("**ASME B31.8/B31.4 + API RP 1111**")

    with st.expander("📚 Understanding Wall Thickness Design"):
        st.markdown('''
        The wall thickness must be sufficient to:
        1. **Contain Internal Pressure** (Hoop Stress) - t = P × OD / (2 × SMYS × f_d)
        2. **Resist External Pressure** (Collapse) - Critical for deepwater
        3. **Prevent Buckle Propagation** - P_pr = 24 × SMYS × (t/OD)^2.4
        ''')

    col1, col2 = st.columns(2)
    with col1:
        code = st.selectbox("Design Code", ["ASME B31.8 (Gas)", "ASME B31.4 (Liquid)"])
        nps = st.selectbox("Pipe Size (NPS)", list(NPS_OD.keys()), index=7)
        OD = NPS_OD[nps]
        st.info(f"OD: {OD} mm")
        grade = st.selectbox("Material Grade", list(GRADES.keys()), index=1)
        SMYS, SMTS = GRADES[grade]
        st.info(f"SMYS: {SMYS} MPa | SMTS: {SMTS} MPa")

    with col2:
        P_design = st.number_input("Design Pressure (MPa)", 0.1, 50.0, 10.0, 0.5)
        T_design = st.number_input("Design Temperature (°C)", -40.0, 200.0, 85.0)
        depth = st.number_input("Water Depth (m)", 0.0, 3000.0, 100.0, 10.0)
        CA = st.number_input("Corrosion Allowance (mm)", 0.0, 10.0, 3.0, 0.5)

    f_d = 0.5 if "B31.8" in code else 0.6
    f_T = 1.0 if T_design <= 121 else 0.967
    tol = 0.9

    # Calculations
    t_hoop = (P_design * OD) / (2 * SMYS * f_d * f_T) / tol + CA
    P_ext = 1025 * 9.81 * depth / 1e6
    t_buckle = OD * (P_ext / (0.8 * 24 * SMYS))**(1/2.4) + CA if P_ext > 0 else 0
    t_min = max(t_hoop, t_buckle)

    std_wt = [6.35, 7.92, 9.53, 11.13, 12.7, 14.27, 15.88, 17.48, 19.05, 22.23, 25.4]
    t_sel = min([w for w in std_wt if w >= t_min], default=std_wt[-1])

    st.markdown("---")
    st.subheader("Results")
    c1, c2, c3, c4 = st.columns(4)
    c1.metric("Hoop WT", f"{t_hoop:.2f} mm")
    c2.metric("Buckle WT", f"{t_buckle:.2f} mm")
    c3.metric("Min Required", f"{t_min:.2f} mm")
    c4.metric("Selected WT", f"{t_sel:.2f} mm")

    # Chart
    fig = make_subplots(rows=1, cols=2, subplot_titles=("WT vs Pressure", "WT Components"))
    pressures = np.linspace(1, 30, 30)
    wts = [(p * OD) / (2 * SMYS * f_d * f_T) / tol + CA for p in pressures]
    fig.add_trace(go.Scatter(x=pressures, y=wts, name="Required WT"), row=1, col=1)
    fig.add_hline(y=t_sel, line_dash="dash", line_color="red", row=1, col=1)
    fig.add_trace(go.Bar(x=["Hoop", "Buckle", "Selected"], y=[t_hoop, t_buckle, t_sel]), row=1, col=2)
    fig.update_layout(height=400, showlegend=False)
    st.plotly_chart(fig, use_container_width=True)

    with st.expander("📐 Formulas"):
        st.latex(r"t_{hoop} = \\frac{P \\times OD}{2 \\times SMYS \\times f_d \\times f_T}")
        st.latex(r"P_{pr} = 24 \\times SMYS \\times (t/OD)^{2.4}")

# ============ FREE SPAN CALCULATOR ============
elif calc_type == "Free Span (DNV-RP-F105)":
    st.header("Free Span Calculator")
    st.markdown("**DNV-RP-F105** | VIV Screening")

    col1, col2 = st.columns(2)
    with col1:
        L_span = st.number_input("Span Length (m)", 1.0, 100.0, 15.0)
        OD = st.number_input("Outside Diameter (mm)", 100.0, 1500.0, 323.9)
        WT = st.number_input("Wall Thickness (mm)", 5.0, 50.0, 12.7)
        t_conc = st.number_input("Concrete Thickness (mm)", 0.0, 150.0, 40.0)
    with col2:
        depth = st.number_input("Water Depth (m)", 5.0, 500.0, 50.0, key="fs_depth")
        Uc = st.number_input("Current Velocity (m/s)", 0.0, 3.0, 0.6)
        T_op = st.number_input("Operating Temp (°C)", 0.0, 150.0, 60.0)
        T_amb = st.number_input("Ambient Temp (°C)", 0.0, 40.0, 15.0)

    # Section properties
    D_total = (OD + 2*t_conc) / 1000
    ID = OD - 2*WT
    A_st = np.pi/4 * ((OD/1000)**2 - (ID/1000)**2)
    I_st = np.pi/64 * ((OD/1000)**4 - (ID/1000)**4)
    m_st = A_st * 7850
    m_conc = np.pi/4 * (D_total**2 - (OD/1000)**2) * 3000
    m_water = np.pi/4 * D_total**2 * 1025
    m_eff = m_st + m_conc + m_water

    E = 207e9
    EI = E * I_st
    C1 = np.pi**2

    f_n = (C1 / (2*np.pi)) * np.sqrt(EI / (m_eff * L_span**4))
    St = 0.2
    U_cr = f_n * D_total / St

    screening = Uc / U_cr if U_cr > 0 else 999
    status = "PASS" if screening < 0.8 else "FAIL"

    st.markdown("---")
    st.subheader("Results")
    c1, c2, c3, c4 = st.columns(4)
    c1.metric("Natural Freq", f"{f_n:.3f} Hz")
    c2.metric("Onset Velocity", f"{U_cr:.2f} m/s")
    c3.metric("Screening Ratio", f"{screening:.2f}")
    c4.metric("VIV Status", status)

    if status == "PASS":
        st.success("No VIV expected at this span length")
    else:
        st.error("VIV likely - reduce span length or increase stiffness")

    # Chart
    spans = np.linspace(5, 50, 30)
    freqs = [(C1/(2*np.pi)) * np.sqrt(EI/(m_eff*L**4)) for L in spans]
    fig = go.Figure()
    fig.add_trace(go.Scatter(x=spans, y=freqs, name="Natural Frequency"))
    fig.add_vline(x=L_span, line_dash="dash", line_color="red")
    fig.update_layout(xaxis_title="Span Length (m)", yaxis_title="Frequency (Hz)", height=350)
    st.plotly_chart(fig, use_container_width=True)

# ============ CP ANODE CALCULATOR ============
elif calc_type == "CP Anode (DNV-RP-F103)":
    st.header("CP Anode Calculator")
    st.markdown("**DNV-RP-F103** | Cathodic Protection Design")

    col1, col2 = st.columns(2)
    with col1:
        condition = st.selectbox("Pipeline Condition", ["Unburied", "Buried"])
        design_life = st.number_input("Design Life (years)", 5, 40, 15)
        length = st.number_input("Pipeline Length (m)", 100.0, 100000.0, 5000.0)
        OD = st.number_input("Pipe OD (mm)", 100.0, 1500.0, 406.4, key="cp_od")
    with col2:
        coating = st.selectbox("Coating Type", ["FBE + CWC", "3LPE/3LPP", "Asphalt"])
        temp = st.number_input("Temperature (°C)", 0.0, 150.0, 50.0)
        material = st.selectbox("Material", ["Carbon Steel", "13Cr Stainless", "Duplex"])

    # Calculate surface area
    A_surface = np.pi * (OD/1000) * length

    # Current density based on condition
    ic_base = 20 if condition == "Unburied" else 3

    # Coating factor
    fc = {"FBE + CWC": 0.02, "3LPE/3LPP": 0.01, "Asphalt": 0.03}[coating]

    # Material factor
    mat_f = {"Carbon Steel": 1.0, "13Cr Stainless": 0.7, "Duplex": 0.5}[material]

    # Current demand
    I_demand = A_surface * fc * ic_base * mat_f / 1000

    # Anode weight (Al capacity = 2000 Ah/kg)
    W_anode = I_demand * design_life * 8760 / (0.85 * 2000)
    n_anodes = int(np.ceil(W_anode / 150))

    # CPR check
    current_density = I_demand / A_surface
    cpr = "PASS" if current_density < 0.05 else "FAIL"

    st.markdown("---")
    st.subheader("Results")
    c1, c2, c3, c4 = st.columns(4)
    c1.metric("Current Demand", f"{I_demand:.1f} A")
    c2.metric("Anode Weight", f"{W_anode:.0f} kg")
    c3.metric("Number of Anodes", f"{n_anodes}")
    c4.metric("SSCC Check (CPR)", cpr)

    if cpr == "PASS":
        st.success("Pipeline protected from stress corrosion cracking")
    else:
        st.error("SSCC Risk - consider burying pipeline or improving coating")

# ============ CORROSION ASSESSMENT ============
elif calc_type == "Corrosion Assessment (DNV-RP-F101)":
    st.header("Corrosion Assessment")
    st.markdown("**DNV-RP-F101** | Corroded Pipeline Evaluation")

    col1, col2 = st.columns(2)
    with col1:
        OD = st.number_input("Outside Diameter (mm)", 100.0, 1500.0, 323.9, key="corr_od")
        WT = st.number_input("Wall Thickness (mm)", 5.0, 50.0, 12.7, key="corr_wt")
        SMTS = st.number_input("SMTS (MPa)", 350.0, 700.0, 460.0)
    with col2:
        d_defect = st.number_input("Defect Depth (mm)", 0.1, float(WT-0.1), 4.0)
        L_defect = st.number_input("Defect Length (mm)", 1.0, 1000.0, 100.0)
        P_op = st.number_input("Operating Pressure (MPa)", 0.1, 50.0, 8.0)

    # Intact burst pressure
    P_b = 2 * WT * SMTS * 0.96 / OD

    # Length correction
    Q = np.sqrt(1 + 0.31 * (L_defect / np.sqrt(OD * WT))**2)

    # Defect burst pressure
    d_ratio = d_defect / WT
    P_f = P_b * (1 - d_ratio) / (1 - d_ratio/Q) if d_defect < WT else 0

    # Safe pressure
    P_safe = P_f / 1.1

    margin = P_safe / P_op if P_op > 0 else 999
    status = "PASS" if margin >= 1.0 else "FAIL"

    st.markdown("---")
    st.subheader("Results")
    c1, c2, c3, c4 = st.columns(4)
    c1.metric("Depth Ratio", f"{d_ratio*100:.1f}%")
    c2.metric("Burst Pressure", f"{P_f:.1f} MPa")
    c3.metric("Safe Pressure", f"{P_safe:.1f} MPa")
    c4.metric("Status", status)

    if status == "PASS":
        st.success(f"Safe to operate at {P_op} MPa (margin: {margin:.2f})")
    else:
        st.error(f"Reduce pressure below {P_safe:.1f} MPa or repair")

    # Chart
    depths = np.linspace(0.1, WT*0.9, 30)
    strengths = [P_b * (1 - d/WT) / (1 - d/(WT*Q)) / P_b * 100 for d in depths]
    fig = go.Figure()
    fig.add_trace(go.Scatter(x=depths/WT*100, y=strengths))
    fig.add_vline(x=d_ratio*100, line_dash="dash", line_color="red")
    fig.update_layout(xaxis_title="Depth Ratio (%)", yaxis_title="Remaining Strength (%)", height=350)
    st.plotly_chart(fig, use_container_width=True)

# ============ ON-BOTTOM STABILITY ============
elif calc_type == "On-Bottom Stability (DNV-RP-F109)":
    st.header("On-Bottom Stability")
    st.markdown("**DNV-RP-F109** | Lateral Stability Check")

    col1, col2 = st.columns(2)
    with col1:
        OD = st.number_input("Steel OD (mm)", 100.0, 1500.0, 323.9, key="obs_od")
        WT = st.number_input("Wall Thickness (mm)", 5.0, 50.0, 15.9, key="obs_wt")
        t_conc = st.number_input("Concrete Thickness (mm)", 0.0, 200.0, 50.0, key="obs_conc")
        rho_conc = st.number_input("Concrete Density (kg/m³)", 2000, 4000, 3040)
    with col2:
        depth = st.number_input("Water Depth (m)", 5.0, 500.0, 80.0, key="obs_depth")
        Hs = st.number_input("Sig. Wave Height (m)", 0.5, 20.0, 6.0)
        Tp = st.number_input("Peak Period (s)", 5.0, 25.0, 12.0)
        Uc = st.number_input("Current (m/s)", 0.0, 3.0, 0.6, key="obs_uc")
        mu = st.number_input("Friction Coeff", 0.1, 1.0, 0.6)

    # Section properties
    D_total = (OD + 2*t_conc) / 1000
    ID = OD - 2*WT
    A_st = np.pi/4 * ((OD/1000)**2 - (ID/1000)**2)
    A_conc = np.pi/4 * (D_total**2 - (OD/1000)**2)

    m_st = A_st * 7850
    m_conc = A_conc * rho_conc
    m_total = m_st + m_conc
    m_disp = np.pi/4 * D_total**2 * 1025
    W_sub = (m_total - m_disp) * 9.81
    SG = m_total / m_disp if m_disp > 0 else 0

    # Wave velocity (simplified)
    L0 = 9.81 * Tp**2 / (2*np.pi)
    k = 2*np.pi / L0
    U_w = np.pi * Hs / Tp / np.sinh(k * depth) if depth > 0 else 0
    U_total = U_w + Uc

    # Forces
    C_D, C_L = 0.7, 0.9
    F_D = 0.5 * 1025 * C_D * D_total * U_total**2
    F_L = 0.5 * 1025 * C_L * D_total * U_total**2

    # Unity check
    UC = 1.1 * F_D / (mu * (W_sub - F_L)) if (W_sub - F_L) > 0 else 999
    status = "PASS" if UC <= 1.0 else "FAIL"

    st.markdown("---")
    st.subheader("Results")
    c1, c2, c3, c4 = st.columns(4)
    c1.metric("Submerged Weight", f"{W_sub:.0f} N/m")
    c2.metric("Specific Gravity", f"{SG:.2f}")
    c3.metric("Unity Check", f"{UC:.2f}")
    c4.metric("Status", status)

    if status == "PASS":
        st.success("Pipeline is stable")
    else:
        st.error("Increase concrete thickness or density")

    # Chart - UC vs concrete
    concs = np.linspace(20, 150, 30)
    UCs = []
    for tc in concs:
        Dt = (OD + 2*tc) / 1000
        Ac = np.pi/4 * (Dt**2 - (OD/1000)**2)
        mc = Ac * rho_conc
        mt = m_st + mc
        md = np.pi/4 * Dt**2 * 1025
        Ws = (mt - md) * 9.81
        Fd = 0.5 * 1025 * C_D * Dt * U_total**2
        Fl = 0.5 * 1025 * C_L * Dt * U_total**2
        uc = 1.1 * Fd / (mu * (Ws - Fl)) if (Ws - Fl) > 0 else 5
        UCs.append(min(uc, 3))

    fig = go.Figure()
    fig.add_trace(go.Scatter(x=concs, y=UCs))
    fig.add_hline(y=1.0, line_dash="dash", line_color="red")
    fig.add_vline(x=t_conc, line_dash="dash", line_color="green")
    fig.update_layout(xaxis_title="Concrete Thickness (mm)", yaxis_title="Unity Check", height=350)
    st.plotly_chart(fig, use_container_width=True)

# ============ END EXPANSION ============
elif calc_type == "End Expansion (DNV-ST-F101)":
    st.header("End Expansion Calculator")
    st.markdown("**DNV-ST-F101** | Thermal Expansion Analysis")

    col1, col2 = st.columns(2)
    with col1:
        OD = st.number_input("Outside Diameter (mm)", 100.0, 1500.0, 406.4, key="ee_od")
        WT = st.number_input("Wall Thickness (mm)", 5.0, 50.0, 14.27, key="ee_wt")
        L_pipe = st.number_input("Pipeline Length (m)", 100.0, 50000.0, 5000.0)
    with col2:
        T_op = st.number_input("Operating Temp (°C)", 0.0, 150.0, 85.0, key="ee_top")
        T_amb = st.number_input("Ambient Temp (°C)", -10.0, 40.0, 20.0, key="ee_tamb")
        P_op = st.number_input("Operating Pressure (MPa)", 0.0, 50.0, 10.0, key="ee_pop")
        f_axial = st.number_input("Axial Friction (N/m²)", 100.0, 5000.0, 1500.0)

    # Properties
    E = 207e9
    alpha = 11.7e-6
    ID = OD - 2*WT
    A_st = np.pi/4 * ((OD/1000)**2 - (ID/1000)**2)
    A_int = np.pi/4 * (ID/1000)**2
    D_outer = OD/1000 + 0.05  # Assume 50mm coating

    delta_T = T_op - T_amb

    # Forces
    F_thermal = E * A_st * alpha * delta_T
    F_pressure = P_op * 1e6 * A_int * (1 - 2*0.3)
    S_eff = F_thermal - F_pressure

    # Anchor length
    L_anchor = abs(S_eff) / (f_axial * np.pi * D_outer)
    L_anchor = min(L_anchor, L_pipe/2)

    # End expansion
    delta = abs(S_eff) * L_anchor / (2 * E * A_st)

    st.markdown("---")
    st.subheader("Results")
    c1, c2, c3, c4 = st.columns(4)
    c1.metric("Temp Rise", f"{delta_T:.0f} °C")
    c2.metric("Thermal Force", f"{F_thermal/1e6:.2f} MN")
    c3.metric("Anchor Length", f"{L_anchor:.0f} m")
    c4.metric("End Expansion", f"{delta*1000:.0f} mm")

    if delta > 0.5:
        st.warning(f"Large expansion ({delta*1000:.0f} mm) - consider expansion loops")
    else:
        st.success(f"Expansion of {delta*1000:.0f} mm is manageable")

    # Chart
    temps = np.linspace(20, 100, 30)
    expansions = []
    for dT in temps:
        Fth = E * A_st * alpha * dT
        Seff = Fth - F_pressure
        La = min(abs(Seff) / (f_axial * np.pi * D_outer), L_pipe/2)
        d = abs(Seff) * La / (2 * E * A_st)
        expansions.append(d * 1000)

    fig = go.Figure()
    fig.add_trace(go.Scatter(x=temps, y=expansions))
    fig.add_vline(x=delta_T, line_dash="dash", line_color="red")
    fig.update_layout(xaxis_title="Temperature Rise (°C)", yaxis_title="End Expansion (mm)", height=350)
    st.plotly_chart(fig, use_container_width=True)

# Footer
st.sidebar.markdown("---")
st.sidebar.markdown("### References")
st.sidebar.markdown("- DNV-RP-F105/F109/F101/F103")
st.sidebar.markdown("- ASME B31.8/B31.4")
st.sidebar.markdown("- API RP 1111")
st.sidebar.markdown("---")
st.sidebar.caption("v1.0 | Educational Tool")
`

            streamlitConfig: {
